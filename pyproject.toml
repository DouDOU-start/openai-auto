[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol-reg"
version = "0.1.0"
description = "最小交互式协议注册/授权 CLI"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "curl_cffi>=0.7.0",
  "PyYAML>=6.0",
  "pydantic>=2.0.0",
  "websockets>=12.0",
  "requests>=2.31.0",
  "httpx[socks]>=0.27.0",
  "pymysql>=1.1.0",
  "PySocks>=1.7.1",
  "cloudflare>=3.0.0",
  "google-api-python-client>=2.0.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.0",
  "docker>=7.0.0",
  "dnspython>=2.6.0",
  "cachetools>=5.3.0",
  "cryptography>=42.0.0",
  "psutil>=5.9.0"
]

[project.scripts]
protocol-reg = "protocol_reg.cli:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["protocol_reg*", "utils*"]

[tool.setuptools.package-data]
utils = ["auth_core*.so", "auth_core*.pyd"]
