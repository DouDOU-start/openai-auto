# protocol-reg 配置示例。
# 复制为 config/protocol-reg.yaml 后按需填写；实际配置文件默认不提交，避免泄露密钥。
# 注册、登录和授权请求代理；支持 http://用户名:密码@主机:端口 这类格式，留空则不使用代理。
proxy: ""
# 多代理池；优先级高于 proxy。多个任务/调用会按顺序轮询，平均分配到每个代理。
proxies:
  # - "http://用户名:密码@主机1:端口"
  # - "http://用户名:密码@主机2:端口"
# Web 端任务最大并发数；多余任务会排队等待。
max_concurrency: 3
# 注册模式邮箱留空时，会从这些后缀中随机生成邮箱；可写多个后缀。
email_suffixes:
  - "your-domain.com"
email_code:
  # cloudflare-email 服务地址，例如 https://mail.your-domain.com；留空则禁用自动取码。
  api: ""
  # cloudflare-email ADMIN_API_KEY；留空则禁用自动取码。
  key: ""
  # 只读取该发件人域名后缀的验证码邮件。
  sender_suffix: "openai.com"
  # 等待验证码的最长秒数。
  timeout: 120
  # 轮询邮箱验证码的间隔秒数，最小会按 0.5 秒处理。
  poll: 2.0
  # 验证码为空、过期或 wrong_email_otp_code 时，自动重新发信并重试的轮数。
  max_otp_retries: 5
  # 每一轮等待邮箱验证码的最大轮询次数。
  otp_poll_max_attempts: 20
  # cloudflare-email API 是否也走当前任务代理；自建邮箱 API 通常保持 false。兼容 use_proxy_for_email 写法。
  use_proxy: false
smsbower:
  # SMSBower API 地址；文档要求请求 https://smsbower.page/stubs/handler_api.php。
  api: "https://smsbower.page/stubs/handler_api.php"
  # SMSBower API key；配置后仅 Web 批量 OAuth 授权阶段遇到手机验证会自动接码。
  key: ""
  # 服务代码；SMSBower 服务表中 OpenAI (ChatGPT) 为 dr。
  service: "dr"
  # 国家代码；留空表示不指定。常用：美国实体号 187，美国虚拟号 12，中国 3，香港 14，加拿大 36，英国 16。
  country: ""
  # 可选价格过滤；留空表示不限制。
  max_price: ""
  min_price: ""
  # 可选供应商过滤，多个 ID 用英文逗号分隔。
  provider_ids: ""
  except_provider_ids: ""
  # 可选排除号码前缀，多个前缀用英文逗号分隔，例如 7918,7900111。
  phone_exception: ""
  # 等待短信验证码的最长秒数。
  timeout: 30
  # 轮询短信验证码的间隔秒数，最小会按 1 秒处理。
  poll: 5.0
  # SMSBower API 是否也走当前任务代理。
  use_proxy: true
  # 同一个号码成功验证多少次后 setStatus=6 完成释放；默认按 3 次复用，减少浪费。
  reuse_limit: 3
checkout_sms:
  # checkout 浏览器里 PayPal 手机验证的自动收码配置。可配置多个号码，脚本会按顺序选择。
  timeout: 180
  # 轮询短信链接的间隔秒数，最小会按 1 秒处理。
  poll: 2.0
  numbers:
    - phone: "你的手机号"
      sms_url: "http://a.62-us.com/api/get_sms?key=你的key"
      label: "62-us PayPal"
airgate_monitor:
  # AirGate core 的 admin API 基地址，例如 http://127.0.0.1:8080
  core_url: ""
  # AirGate admin key，用于读取和更新账号。
  admin_key: ""
  # 监控时可选代理；留空则沿用当前任务代理。
  proxy: ""
  # 轮询间隔秒数。
  poll_interval_seconds: 300
  # 每次巡检拉取的账号页大小，最大 100。
  page_size: 100
  # 同时重新登录的并发数，建议 2~5。
  relogin_concurrency: 3
